<section class="login-page">
  <div class="login-wrapper">
    <aside class="hero-side">
      <div class="lock-circle">🔒</div>
      <p>Accede a tu cuenta para gestionar tus proyectos y tareas de forma segura.</p>
    </aside>

    <mat-card class="login-card section-card">
      <div class="brand">TaskPro</div>
      <h1>Iniciar sesión</h1>
      <p>Ingresa tus credenciales para continuar</p>

      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" type="email" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Contraseña</mat-label>
          <input matInput formControlName="password" type="password" />
        </mat-form-field>

        <button mat-flat-button class="primary-btn" type="submit" [disabled]="form.invalid || loading">
          {{ loading ? 'Ingresando...' : 'Ingresar' }}
        </button>
      </form>
    </mat-card>
  </div>
</section>
